<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form validation</title>
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- custom css -->
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>
    <main>
        <section class="login-section">
            <div class="container">
                <div class="card p-4 p-md-5">
                    <form id="loginForm">
                        <h1 class="fs-3 text-center mb-4"> Login to your account</h1>
                        <label for="loginUsername" class="form-label">Username</label>
                        <input type="email" class="form-control mb-4" id="loginUsername" placeholder="example@mail.com"
                            required>

                        <label for="loginPassword" class="form-label">Password</label>
                        <div class="input-group mb-3">
                            <input id="loginPassword" type="password" class="form-control" name="password">
                            <span class="input-group-text fa fa-eye-slash toggle-password" data-toggle-target="#loginPassword">
                            </span>
                        </div>

                        <button class="btn btn-primary mb-4" type="submit">Login</button>
                        <span id="loginError" class="error-message text-danger"></span>
                        <p class="text-secondary  text-center">Don't have an account? <a href="signup.html">Sign Up</a>
                        </p>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- custom script -->
    <script src="./js/index.js"></script>
</body>

</html>
